lang: Language

toggle_theme: Toggle theme
open_toolbar: Open toolbar
close_toolbar: Close toolbar

head:
  title: "Daddy's Resume - Free Markdown Resume Builder | No Signup, ATS-Friendly"
  desc: "Build your resume for free using Markdown. Real-time PDF preview, ATS-friendly templates, no account needed. Your data stays in your browser. Export to PDF in one click."
  keywords: "markdown resume builder, free resume builder, free resume builder online, ATS resume builder, resume builder no signup, resume builder no login, free resume maker, resume builder no account, pdf resume builder, markdown resume, free cv builder, resume builder browser, open source resume builder"

landing:
  hero: Write your <span text-primary>resumes</span> in Markdown!
  desc: is a free, open-source tool that helps you easily create and manage your resumes, while keeping your data private.
  start: Create My Resume
  feats:
    - title: Simple and Powerful
      items: Manage multiple resumes<br>Real-time preview<br>Export to PDF<br>Fully customizable<br>Choose fonts and add icons<br>And <a href="https://github.com/amitVaibhavTiwari/Daddy-s-Resume#features" target="_blank">more features</a>
    - title: Privacy First
      items: Open source and free<br>All data is saved locally<br>No login or registration needed<br>No user tracking<br>No ads

dashboard:
  my_resumes: My Resumes
  created: "Created: "
  updated: "Updated: "
  new: New
  saveas: Export JSON Data
  import: Import JSON Data
  rename: Rename
  duplicate: Duplicate
  delete: Delete
  delete_confirm:
    title: Delete Resume
    message: Are you sure you want to delete "{name}"? This action cannot be undone.
    placeholder: Type 'delete' to confirm
    button: Delete Resume
  cancel: Cancel
  confirm: I understand, continue
  drive_sync:
    sync:
      title: Sync to Google Drive
      message: This creates a file in your Google Drive containing all your resume data. If you switch to a new device later, your resumes stay safe there and you can restore them anytime using Import from Drive.
    import:
      title: Import from Google Drive
      message: If you've previously synced your resumes to Google Drive, this loads them back here just as they were at your last sync. Make sure you're signed in with the same Google account you used to sync.
  file:
    export:
      title: Export JSON Data
      message: If you don't want to use Google Drive sync, this downloads all your resume data as a JSON file. Keep it somewhere safe, you can import it back anytime on this device or any other.
    import:
      title: Import JSON Data
      message: This restores your resume data from a JSON file you previously exported from Daddy's Resume. Only pick a file that was exported from this app, other JSON files won't work.

toolbar:
  file:
    title: File
    save: Save
    rename: Rename
    import:
      trigger: Import Markdown
      dialog:
        header: Import a Markdown file
        from_local: Drag your file here, or click here to choose a file
        from_url: Paste file URL
    export_pdf:
      title: Export PDF
      alert:
        title: Heads up!
        content: When printing on Windows, please select "Save as PDF" in the print settings popup, <b>not</b> "Microsoft Print to PDF".
    export_md: Export Markdown
  correct_case:
    title: Correct Case
    example:
      title: Example
      content: |
        "Github" → "GitHub"
    note:
      title: Note
      content: Words that are only in uppercase or lowercase ("GITHUB" or "github") will be left untouched.
    btn : Correct it!
  paper_size: Paper Size
  theme_color: Theme Color
  font_family:
    title: Font Family
    cjk: CJK
    en: English
  font_size: Font Size
  margins:
    title: Margins
    vertical: Top & Bottom
    horizontal: Left & Right
  paragraph_spacing: Paragraph Spacing
  line_height: Line Spacing

notification:
  save: Your changes have been saved
  switch: Switched to resume "{msg}"
  delete: Resume "{msg}" has been deleted
  new: New resume created
  duplicate: Created resume "{old}"'s duplication "{new}"
  correct:
    yes: Corrected {num} words
    no : All case are correct!
  import:
    yes: Data has been successfully imported!
    no : Data format is invalid.
